name: zhixing_ai
description: >-
  知行AI — 端侧 AI 军师，帮你明确目标、拆解策略。
  基于 OKR 框架，通过对话提取人生目标，制定可执行路径。
version: 1.0.0+1
repository: https://github.com/SuperJieLab/zhixing-ai
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  dio: ^5.7.0
  path_provider: ^2.1.5
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  llama_cpp_dart:
    git:
      url: https://github.com/netdur/llama_cpp_dart.git
      ref: v0.9.0-dev.9
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
