name: socratic_ai
description: >-
  苏格拉底式 AI 对话 — 端侧推理、隐私零上传。
  通过 Qwen 2.5 1.5B 端侧 LLM 驱动的追问、洞察总结与思维图谱，
  帮助用户理清思路、发现认知盲区。
version: 1.0.0+1
repository: https://github.com/SuperJieLab/socratic-ai
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  dio: ^5.7.0
  path_provider: ^2.1.5
  llama_cpp_dart:
    git:
      url: https://github.com/netdur/llama_cpp_dart.git
      ref: v0.9.0-dev.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
